[build]
  command = "npm run build"
  publish = "dist/client"

[[redirects]]
  from = "/posts"
  to = "/"
  status = 301

[[redirects]]
  from = "/posts/:slug"
  to = "/post/:slug"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
